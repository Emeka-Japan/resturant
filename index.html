<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger House</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/animations.css"> 

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

</head>

<body>


    <!-- Loader -->
    <div class="loader">
        <div class="burger-loader"></div>
    </div>

    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <div class="logo">🍔 BurgerHouse</div>

            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Menu</a></li>
                <li><a href="#">Offers</a></li>
                <li><a href="#">Gallery</a></li>
                <li><a href="#">Contact</a></li>
            </ul>

            <button class="order-btn">Order Now</button>

        </nav>
    </header>

    <!-- Hero -->
    <section class="hero">

        <div class="hero-content">
            <h1>Ultimate Burger Experience</h1>
            <p>Fresh • Juicy • Delicious</p>

            <button class="hero-btn">
                Explore Menu
            </button>
        </div>

        <div class="burger-3d">
                <img src="IMG_20260612_124501.jpg" alt="Premium Burger">
        </div>

    </section>

    <!-- Featured Burgers -->
    <section class="menu">

        <h2>Popular Burgers</h2>

        <div class="cards">

            <div class="card">
                    <img src="IMG_20260612_124918.jpg" alt="Cheese Blast">
                <h3>Cheese Blast</h3>
                <p>$9.99</p>
            </div>

            <div class="card">
                    <img src="IMG_20260612_124936.jpg" alt="Doubble Beef">
                <h3>Double Beef</h3>
                <p>$12.99</p>
            </div>

            <div class="card">
                    <img src="IMG_20260612_125008.jpg" alt="">
                <h3>Mega Burger</h3>
                <p>$15.99</p>
            </div>

        </div>

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 Burger House</p>
    </footer>

    <script src="script.js"></script>
</body>
